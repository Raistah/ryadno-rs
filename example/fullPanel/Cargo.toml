[package]
name = "fullPanel"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["tokio", "http1"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net"] }
ryadno = { path = "../../ryadno" }
minijinja = { version = "2.15.1", features = ["builtins", "multi_template", "serde", "debug", "std_collections", "loader", "urlencode", "json", "loop_controls", "stacker", "speedups"] }
validator = { version = "0.20.0", features = ["derive"] }
serde_json = "1.0.149"
