[package]
name = "ryadno"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "make"
path = "src/bin/make.rs"

[dependencies]
ryadno_macro = { workspace = true }
axum = { version = "0.8.8", features = ["form"] }
axum_csrf = { version = "0.11.0", features = ["layer"] }
clap = { version = "4.5.58", features = ["derive"] }
futures = "0.3.31"
include_dir = "0.7.4"
linkme = "0.3.35"
minijinja = { version = "2.15.1", features = ["builtins", "multi_template", "serde", "debug", "std_collections", "loader", "urlencode", "json", "loop_controls", "stacker", "speedups"] }
rkyv = { version = "0.8.15", features = ["bytecheck"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tower = {version="0.5.3", features= ["util"]}
tower-http = {version="0.6.8", features= ["trace"]}
tower-layer = "0.3.3"
tower-service = "0.3.3"
tower-sessions = "0.15.0"
tower-sessions-redis-store = "0.16.0"
uuid = { version = "1.22.0", features = ["v4"] }
validator = { version = "0.20.0", features = ["derive"] }
tokio = { version = "1.52.1", features = ["macros", "test-util", "rt-multi-thread"] }
async-trait = "0.1.89"
