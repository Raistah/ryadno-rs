[package]
name = "ryadno"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "make"
path = "src/bin/make.rs"

[dependencies]
axum = "0.8.8"
clap = { version = "4.5.58", features = ["derive"] }
futures = "0.3.31"
include_dir = "0.7.4"
minijinja = { version = "2.15.1", features = ["builtins", "multi_template", "serde", "debug", "std_collections", "loader", "urlencode", "json", "loop_controls", "stacker", "speedups"] }
tower = {version="0.5.3", features= ["util"]}
tower-http = {version="0.6.8", features= ["trace"]}
tower-layer = "0.3.3"
tower-service = "0.3.3"
